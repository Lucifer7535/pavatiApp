name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    name: Check (typecheck, test, audit, build)
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 24
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pavati_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Build workspace libraries
        run: npm run build -w @pavati/shared && npm run build -w @pavati/receipt-engine

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Build
        run: npm ci && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/pavati_ci

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4