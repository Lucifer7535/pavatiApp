name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: heroku-deploy
  cancel-in-progress: false

jobs:
  check:
    name: Check (typecheck, test, audit, build)
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 24
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pavati_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: pavati_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U ci -d pavati_ci
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Build workspace libraries
        run: npm run build -w @pavati/shared && npm run build -w @pavati/receipt-engine

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Heroku
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: git push https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git HEAD:master